[project]
name = "buyer"
version = "0.1.0"
description = "Team Holdout's buyer agent for the Tacto Negotiation Arena"
requires-python = ">=3.12,<3.13"
dependencies = ["arena-kit[anthropic,sim]"]

[project.scripts]
buyer = "buyer.runtime.runner:main"

[tool.uv.sources]
arena-kit = { path = "starter-kit", editable = true }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/buyer"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
